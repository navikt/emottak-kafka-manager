name: 'Test, build and push'
on:
  workflow_call:
    outputs:
      image:
        description: 'The docker image that was built and pushed'
        value: ${{ jobs.test-build-and-push.outputs.image }}

jobs:
  test-build-and-push:
    name: 'Test, build and push'
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: 'Set up JDK 21'
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: 'Setup node'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'web-app/package-lock.json'

      - name: 'Build maven artifacts'
        run: mvn -f ./api/pom.xml -B package

      - name: 'Install dependencies'
        run: npm ci --legacy-peer-deps --prefix web-app

      - name: 'Run web-app tests'
        run: npm test --prefix web-app

      - name: 'Get current date'
        id: date
        run: echo "date=$(date +'%Y.%m.%d-%H.%M')" >> $GITHUB_OUTPUT

      - name: 'Set version in index.html'
        run: sed -i "s/__VERSION__/${{ steps.date.outputs.date }}/g" web-app/index.html

      - name: 'Build frontend assets'
        run: npm run build --prefix web-app

      - name: 'Build and push'
        uses: nais/docker-build-push@v0
        id: docker-push
        with:
          team: team-emottak
          tag: ${{ github.sha }}
          dockerfile: Dockerfile
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
